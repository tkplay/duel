<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Duel</title>
  <meta name="theme-color" content="#1a7a6e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Duel"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/tkplay/duel@main/back.png"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0f5a50;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;}
    #app{background:#1a7a6e;width:100%;max-width:480px;min-height:100vh;padding:16px;color:#fff;position:relative;overflow:hidden;}
    .scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
    .score-box{background:rgba(0,0,0,0.3);border-radius:10px;padding:10px 14px;border:1px solid #c9a84c;}
    .score-box.active{border-color:#f5d020;background:rgba(201,168,76,0.2);}
    .score-label{font-size:11px;color:#c9a84c;text-transform:uppercase;letter-spacing:1px;}
    .score-val{font-size:28px;font-weight:500;color:#fff;}
    .score-cards{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;}
    .played-area{background:rgba(0,0,0,0.2);border-radius:12px;padding:10px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center;gap:16px;border:1px solid rgba(201,168,76,0.3);}
    .played-label{font-size:10px;color:rgba(255,255,255,0.5);text-align:center;margin-bottom:4px;}
    .played-col{text-align:center;}
    .card-played{width:62px;height:88px;border-radius:8px;border:2px solid #c9a84c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:500;overflow:hidden;position:relative;}
    .card-played.num{background:#e8dfc8;color:#1a1a2a;}
    .card-played.spell{background:#2a1a4a;color:#c9a84c;}
    .card-played.cancel{background:#1a3a1a;color:#7fc47f;}
    .card-played.empty{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.2);border-style:dashed;font-size:11px;}
    .card-played img{width:100%;height:100%;object-fit:cover;display:block;}
    .card-played .val-badge{position:absolute;top:3px;left:4px;background:rgba(0,0,0,0.75);color:#f5d020;font-size:13px;font-weight:700;border-radius:4px;padding:1px 5px;line-height:1.4;}
    .turn-bar{text-align:center;font-size:13px;color:#f5d020;margin-bottom:10px;min-height:20px;}
    .hand-area{margin-bottom:10px;}
    .hand-title{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px;display:flex;justify-content:space-between;}
    .hand{display:flex;flex-wrap:wrap;gap:6px;}
    .card-wrap{position:relative;display:inline-block;}
    .card{width:66px;height:92px;border-radius:8px;border:2px solid #c9a84c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer;transition:transform 0.15s;user-select:none;overflow:hidden;position:relative;}
    .card:active{transform:translateY(-8px);}
    .card.num{background:#e8dfc8;color:#1a1a2a;}
    .card.spell{background:#2a1a4a;color:#c9a84c;}
    .card.cancel{background:#1a3a1a;color:#7fc47f;}
    .card.disabled{opacity:0.4;pointer-events:none;}
    .card img{width:100%;height:100%;object-fit:cover;display:block;}
    .card .val-badge{position:absolute;top:3px;left:4px;background:rgba(0,0,0,0.75);color:#f5d020;font-size:13px;font-weight:700;border-radius:4px;padding:1px 5px;line-height:1.4;z-index:2;}
    .card-val{font-size:20px;line-height:1;}
    .card-name{font-size:9px;text-align:center;line-height:1.2;padding:0 2px;}
    .enemy-hand{display:flex;gap:6px;flex-wrap:wrap;}
    .card-back{width:66px;height:92px;border-radius:8px;border:2px solid #c9a84c;overflow:hidden;background:#1a7a6e;}
    .card-back img{width:100%;height:100%;object-fit:cover;display:block;}
    .log{background:rgba(0,0,0,0.25);border-radius:8px;padding:8px 10px;font-size:11px;color:rgba(255,255,255,0.7);min-height:36px;margin-bottom:10px;line-height:1.5;}
    .btn-row{display:flex;gap:8px;justify-content:center;}
    button{background:rgba(201,168,76,0.2);border:1px solid #c9a84c;color:#c9a84c;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;}
    button:active{background:rgba(201,168,76,0.4);}
    .history-toggle{font-size:11px;color:#c9a84c;cursor:pointer;text-align:center;margin-bottom:6px;user-select:none;}
    .history-area{background:rgba(0,0,0,0.2);border-radius:10px;padding:8px 10px;margin-bottom:10px;max-height:110px;overflow-y:auto;border:1px solid rgba(201,168,76,0.2);}
    .hist-row{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:11px;}
    .hist-row:last-child{border-bottom:none;}
    .hist-who{width:22px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0;}
    .hist-who.p1{background:#c9a84c33;color:#c9a84c;}
    .hist-who.p2{background:#4a8acd33;color:#7ab0e0;}
    .hist-card{width:30px;height:42px;border-radius:4px;border:1px solid #c9a84c88;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;overflow:hidden;position:relative;}
    .hist-card.num{background:#e8dfc888;color:#1a1a2a;}
    .hist-card.spell{background:#2a1a4a;color:#c9a84c;}
    .hist-card.cancel{background:#1a3a1a;color:#7fc47f;}
    .hist-card img{width:100%;height:100%;object-fit:cover;}
    .hist-card .hval{position:absolute;top:1px;left:2px;font-size:8px;font-weight:700;color:#f5d020;background:rgba(0,0,0,0.7);border-radius:2px;padding:0 2px;}
    .hist-desc{font-size:10px;color:rgba(255,255,255,0.6);flex:1;}
    #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:200;opacity:0;transition:opacity 0.25s;}
    #overlay.show{opacity:1;}
    #overlay-text{font-size:46px;font-weight:500;text-align:center;padding:0 16px;text-shadow:0 0 30px rgba(245,208,32,0.9),0 4px 16px rgba(0,0,0,0.9);line-height:1.3;}
    #overlay-text.turn{color:#f5d020;}
    #overlay-text.win{color:#f5d020;}
    #overlay-text.lose{color:#e07060;text-shadow:0 0 30px rgba(224,112,96,0.9),0 4px 16px rgba(0,0,0,0.9);}
    #overlay-text.draw{color:#a0d8a0;text-shadow:0 0 30px rgba(160,216,160,0.9),0 4px 16px rgba(0,0,0,0.9);}
  </style>
</head>
<body>
<div id="app">
  <div id="overlay"><span id="overlay-text"></span></div>
  <div class="scores">
    <div class="score-box" id="p1box"><div class="score-label">Joueur 1</div><div class="score-val" id="p1score">0</div><div class="score-cards" id="p1cards">10 cartes</div></div>
    <div class="score-box" id="p2box"><div class="score-label">Joueur 2 (IA)</div><div class="score-val" id="p2score">0</div><div class="score-cards" id="p2cards">10 cartes</div></div>
  </div>
  <div class="played-area">
    <div class="played-col"><div class="played-label">Joueur 1</div><div class="card-played empty" id="p1played">—</div></div>
    <div style="font-size:20px;color:rgba(255,255,255,0.3);">VS</div>
    <div class="played-col"><div class="played-label">Joueur 2</div><div class="card-played empty" id="p2played">—</div></div>
  </div>
  <div class="log" id="log">Distribue les cartes pour commencer !</div>
  <div class="turn-bar" id="turnbar"></div>
  <div class="history-toggle" id="histToggle">▼ Historique</div>
  <div class="history-area" id="histArea" style="display:none;"></div>
  <div class="hand-area"><div class="hand-title"><span>Main adversaire</span><span id="p2count"></span></div><div class="enemy-hand" id="p2hand"></div></div>
  <div class="hand-area"><div class="hand-title"><span>Ta main</span><span id="p1count"></span></div><div class="hand" id="p1hand"></div></div>
  <div class="btn-row"><button id="btnStart">Nouvelle partie</button></div>
</div>
<script>
const CDN='https://cdn.jsdelivr.net/gh/tkplay/duel@main/';
const CARD_IMAGES={2:CDN+'dager%202.png',3:CDN+'axe%203.png',4:CDN+'bow%204.png',5:CDN+'spear%205.png',6:CDN+'sword%206.png',7:CDN+'staff%207.png','Bolt':CDN+'bolt.png','Mirror':CDN+'mirror.png','Blast':CDN+'blast.png','Force':CDN+'force%20x2.png','Annul':CDN+'contre.png'};
const CARD_NAMES={2:'Dagger',3:'Axe',4:'Bow',5:'Spear',6:'Sword',7:'Staff'};
const BACK_IMG=CDN+'back.png';
const DECK_DEF=[{val:2,type:'num',name:'2',count:1},{val:3,type:'num',name:'3',count:2},{val:4,type:'num',name:'4',count:3},{val:5,type:'num',name:'5',count:4},{val:6,type:'num',name:'6',count:3},{val:7,type:'num',name:'7',count:2},{val:0,type:'spell',name:'Bolt',label:'⚡',count:3},{val:0,type:'spell',name:'Mirror',label:'🪞',count:3},{val:0,type:'spell',name:'Blast',label:'💥',count:3},{val:0,type:'spell',name:'Force',label:'×2',count:2},{val:0,type:'cancel',name:'Annul',label:'🛡',count:3}];
let state={},histOpen=false;
document.getElementById('histToggle').onclick=()=>{histOpen=!histOpen;document.getElementById('histArea').style.display=histOpen?'block':'none';document.getElementById('histToggle').textContent=(histOpen?'▲':'▼')+' Historique';};
function buildDeck(){let d=[];DECK_DEF.forEach(def=>{for(let i=0;i<def.count;i++)d.push({...def,id:Math.random()});});return d.sort(()=>Math.random()-0.5);}
function cardClass(c){return c.type==='cancel'?'cancel':c.type==='spell'?'spell':'num';}
function getImgKey(c){return c.type==='num'?c.val:c.name;}
function makeCardContent(c,el){const url=CARD_IMAGES[getImgKey(c)];if(url){const img=document.createElement('img');img.src=url;img.alt=c.name;img.onerror=()=>{el.removeChild(img);el.innerHTML=c.type==='num'?`<div class="card-val">${c.val}</div>`:`<div class="card-val" style="font-size:16px">${c.label}</div><div class="card-name">${c.name}</div>`;};el.appendChild(img);if(c.type==='num'){const b=document.createElement('div');b.className='val-badge';b.textContent=c.val;el.appendChild(b);}}else{el.innerHTML=c.type==='num'?`<div class="card-val">${c.val}</div>`:`<div class="card-val" style="font-size:16px">${c.label}</div><div class="card-name">${c.name}</div>`;}}
function renderPlayedCard(el,c){el.innerHTML='';if(!c){el.className='card-played empty';el.textContent='—';return;}el.className='card-played '+cardClass(c);const url=CARD_IMAGES[getImgKey(c)];if(url){const img=document.createElement('img');img.src=url;img.alt=c.name;img.onerror=()=>{el.removeChild(img);el.innerHTML=c.type==='num'?`<div style="font-size:22px">${c.val}</div>`:`<div style="font-size:14px">${c.label||''}</div><div style="font-size:9px">${c.name}</div>`;};el.appendChild(img);if(c.type==='num'){const b=document.createElement('div');b.className='val-badge';b.textContent=c.val;el.appendChild(b);}}else{el.innerHTML=c.type==='num'?`<div style="font-size:22px">${c.val}</div>`:`<div style="font-size:14px">${c.label||''}</div><div style="font-size:9px">${c.name}</div>`;}}
function log(msg){document.getElementById('log').textContent=msg;}
function addHistory(player,card,desc){state.history.push({player,card,desc});renderHistory();}
function renderHistory(){const el=document.getElementById('histArea');el.innerHTML='';[...state.history].reverse().forEach(e=>{const row=document.createElement('div');row.className='hist-row';const who=document.createElement('div');who.className='hist-who '+(e.player===1?'p1':'p2');who.textContent=e.player===1?'J1':'IA';const hcard=document.createElement('div');hcard.className='hist-card '+cardClass(e.card);const url=CARD_IMAGES[getImgKey(e.card)];if(url){const i=document.createElement('img');i.src=url;hcard.appendChild(i);if(e.card.type==='num'){const hv=document.createElement('div');hv.className='hval';hv.textContent=e.card.val;hcard.appendChild(hv);}}else hcard.innerHTML=e.card.type==='num'?`<span>${e.card.val}</span>`:`<span style="font-size:9px">${e.card.label||e.card.name}</span>`;const desc=document.createElement('div');desc.className='hist-desc';desc.textContent=e.desc;row.appendChild(who);row.appendChild(hcard);row.appendChild(desc);el.appendChild(row);});}
let overlayTimer=null;
function showOverlay(text,cls,persist){const ov=document.getElementById('overlay'),ot=document.getElementById('overlay-text');ot.textContent=text;ot.className=cls;ov.classList.add('show');if(overlayTimer)clearTimeout(overlayTimer);if(!persist)overlayTimer=setTimeout(()=>ov.classList.remove('show'),1000);}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
function setTurn(t){document.getElementById('turnbar').textContent=t===1?'Ton tour ▼':t===2?"Tour de l'IA...":'';document.getElementById('p1box').classList.toggle('active',t===1);document.getElementById('p2box').classList.toggle('active',t===2);if(t===1)showOverlay('À votre tour !','turn',false);}
function updateScores(){document.getElementById('p1score').textContent=state.p1score;document.getElementById('p2score').textContent=state.p2score;document.getElementById('p1cards').textContent=state.p1hand.length+' carte'+(state.p1hand.length!==1?'s':'');document.getElementById('p2cards').textContent=state.p2hand.length+' carte'+(state.p2hand.length!==1?'s':'');document.getElementById('p1count').textContent=state.p1hand.length;document.getElementById('p2count').textContent=state.p2hand.length;}
function makeBackCard(){const d=document.createElement('div');d.className='card-back';const img=document.createElement('img');img.src=BACK_IMG;img.alt='carte';img.onerror=()=>{d.removeChild(img);d.style.cssText='display:flex;align-items:center;justify-content:center;color:#c9a84c;font-size:18px;';d.textContent='✦';};d.appendChild(img);return d;}
function renderP2Hand(){const el=document.getElementById('p2hand');el.innerHTML='';state.p2hand.forEach(()=>el.appendChild(makeBackCard()));}
function renderP1Hand(disabled){const el=document.getElementById('p1hand');el.innerHTML='';state.p1hand.forEach((c,i)=>{const wrap=document.createElement('div');wrap.className='card-wrap';const d=document.createElement('div');d.className='card '+cardClass(c)+(disabled?' disabled':'');makeCardContent(c,d);if(!disabled)d.onclick=()=>playCard(1,i);wrap.appendChild(d);el.appendChild(wrap);});}
function undoSpell(lastSpell,logs){if(!lastSpell){logs.push('Contre ! Aucun sort récent à annuler.');return;}const s=lastSpell;if(s.spell==='Bolt'){if(s.caster===1){state.p2score+=s.removedVal;state.p2lastCard=s.removedCard;}else{state.p1score+=s.removedVal;state.p1lastCard=s.removedCard;}logs.push('Contre ! Bolt annulé — '+s.removedVal+' pts restitués.');}else if(s.spell==='Mirror'){if(s.caster===1)state.p1score=Math.max(0,state.p1score-s.copiedVal);else state.p2score=Math.max(0,state.p2score-s.copiedVal);logs.push('Contre ! Mirror annulé — '+s.copiedVal+' pts retirés.');}else if(s.spell==='Blast'){(s.caster===1?state.p2hand:state.p1hand).push(s.removedCard);logs.push('Contre ! Blast annulé — carte restituée.');}else if(s.spell==='Force'){if(s.caster===1)state.p1score=Math.max(0,state.p1score-s.addedVal);else state.p2score=Math.max(0,state.p2score-s.addedVal);logs.push('Contre ! Force annulé — '+s.addedVal+' pts retirés.');}state.lastSpell=null;}
function applySpell(caster,card,logs){const opp=caster===1?2:1;const oppLastNum=caster===1?state.p2lastNumBeforeSpell:state.p1lastNumBeforeSpell;const myLastCard=caster===1?state.p1lastCard:state.p2lastCard;const oppLastCard=caster===1?state.p2lastCard:state.p1lastCard;if(card.name==='Bolt'){if(oppLastCard){const rv=oppLastCard.val;if(caster===1){state.p2score=Math.max(0,state.p2score-rv);state.p2lastCard=null;state.p2lastNumBeforeSpell=null;}else{state.p1score=Math.max(0,state.p1score-rv);state.p1lastCard=null;state.p1lastNumBeforeSpell=null;}state.lastSpell={spell:'Bolt',caster,removedVal:rv,removedCard:oppLastCard};logs.push('Bolt ! '+rv+' pts retirés à J'+opp+'.');}else{logs.push('Bolt ! Adversaire sans carte numérique active.');state.lastSpell=null;}}else if(card.name==='Mirror'){if(oppLastNum){const cv=oppLastNum.val;if(caster===1)state.p1score+=cv;else state.p2score+=cv;state.lastSpell={spell:'Mirror',caster,copiedVal:cv};logs.push('Mirror ! +'+cv+' pts copiés de J'+opp+'.');}else{logs.push('Mirror ! Inefficace — la dernière action adverse était un sort.');state.lastSpell=null;}}else if(card.name==='Blast'){const oppHand=opp===1?state.p1hand:state.p2hand;if(oppHand.length>0){const removed=oppHand.splice(Math.floor(Math.random()*oppHand.length),1)[0];state.lastSpell={spell:'Blast',caster,removedCard:removed};logs.push('Blast ! Carte de J'+opp+' défaussée ('+(CARD_NAMES[removed.val]||removed.name)+')');}else{logs.push('Blast ! Adversaire sans cartes.');state.lastSpell=null;}}else if(card.name==='Force'){if(myLastCard&&myLastCard.type==='num'){const av=myLastCard.val;if(caster===1)state.p1score+=av;else state.p2score+=av;state.lastSpell={spell:'Force',caster,addedVal:av};logs.push('Force ! +'+av+' pts ('+(CARD_NAMES[av]||av)+' doublé).');}else{logs.push('Force ! Pas de carte numérique à doubler.');state.lastSpell=null;}}}
function nextTurn(currentPlayer){const next=currentPlayer===1?2:1;const nextHand=next===1?state.p1hand:state.p2hand;const currentHand=currentPlayer===1?state.p1hand:state.p2hand;if(nextHand.length===0&&currentHand.length===0){endGame();return;}if(nextHand.length===0){log("L'adversaire n'a plus de cartes. Continue !");state.turn=currentPlayer;setTurn(currentPlayer);if(currentPlayer===2)setTimeout(aiPlay,1200);else renderP1Hand(false);return;}state.turn=next;setTurn(next);if(next===2){renderP1Hand(true);setTimeout(aiPlay,1200);}else renderP1Hand(false);}
function playCard(player,idx){if(state.turn!==player||state.gameOver)return;const hand=player===1?state.p1hand:state.p2hand;const card=hand.splice(idx,1)[0];const logs=[];if(card.type==='cancel'){undoSpell(state.lastSpell,logs);addHistory(player,card,logs[0]||'Contre joué.');}else if(card.type==='spell'){if(player===1)state.p1lastNumBeforeSpell=null;else state.p2lastNumBeforeSpell=null;applySpell(player,card,logs);addHistory(player,card,logs[0]||card.name+' joué.');}else{if(player===1){state.p1score+=card.val;state.p1lastCard=card;state.p1lastNumBeforeSpell=card;}else{state.p2score+=card.val;state.p2lastCard=card;state.p2lastNumBeforeSpell=card;}state.lastSpell=null;logs.push('J'+player+' joue '+(CARD_NAMES[card.val]||card.val)+' ('+card.val+'). J1: '+state.p1score+' | J2: '+state.p2score);addHistory(player,card,'+'+card.val+' pts → total '+(player===1?state.p1score:state.p2score));}renderPlayedCard(document.getElementById(player===1?'p1played':'p2played'),card);log(logs[0]||'');updateScores();renderP2Hand();nextTurn(player);}
function aiPlay(){if(state.gameOver)return;if(state.p2hand.length===0){nextTurn(2);return;}const totalCards=state.p2hand.length;const nums=state.p2hand.filter(c=>c.type==='num');const spells=state.p2hand.filter(c=>c.type==='spell');const cancels=state.p2hand.filter(c=>c.type==='cancel');const smallNums=nums.filter(c=>c.val<=4);const bigNums=nums.filter(c=>c.val>=6);const midNums=nums.filter(c=>c.val===5);const p1lastNumVal=state.p1lastNumBeforeSpell?state.p1lastNumBeforeSpell.val:0;const scoreDiff=state.p1score-state.p2score;let chosen=null;if(state.lastSpell&&state.lastSpell.caster===1&&cancels.length>0){const impact=(state.lastSpell.removedVal||state.lastSpell.copiedVal||state.lastSpell.addedVal||0);if(impact>=4)chosen=cancels[0];}if(!chosen){const phase=totalCards>6?'early':totalCards>=3?'mid':'late';if(phase==='early'){if(smallNums.length>0)chosen=smallNums.sort((a,b)=>b.val-a.val)[0];else if(midNums.length>0)chosen=midNums[0];else if(cancels.length>0)chosen=cancels[0];else chosen=spells.find(c=>c.name==='Blast')||bigNums.sort((a,b)=>a.val-b.val)[0]||state.p2hand[0];}else if(phase==='mid'){if(scoreDiff>8&&spells.find(c=>c.name==='Mirror')&&p1lastNumVal>=5&&state.p1lastNumBeforeSpell)chosen=spells.find(c=>c.name==='Mirror');else if(scoreDiff>4&&spells.find(c=>c.name==='Bolt')&&state.p1lastCard)chosen=spells.find(c=>c.name==='Bolt');else if(state.p2lastCard&&state.p2lastCard.val>=6&&spells.find(c=>c.name==='Force'))chosen=spells.find(c=>c.name==='Force');else if(bigNums.length>0)chosen=bigNums.sort((a,b)=>b.val-a.val)[0];else if(spells.find(c=>c.name==='Blast')&&state.p1hand.length>3)chosen=spells.find(c=>c.name==='Blast');else if(midNums.length>0)chosen=midNums[0];else chosen=state.p2hand.sort((a,b)=>(b.val||0)-(a.val||0))[0];}else{if(spells.find(c=>c.name==='Mirror')&&p1lastNumVal>=4&&state.p1lastNumBeforeSpell&&scoreDiff>0)chosen=spells.find(c=>c.name==='Mirror');else if(spells.find(c=>c.name==='Force')&&state.p2lastCard&&state.p2lastCard.val>=5)chosen=spells.find(c=>c.name==='Force');else if(spells.find(c=>c.name==='Bolt')&&state.p1lastCard)chosen=spells.find(c=>c.name==='Bolt');else if(nums.length>0)chosen=nums.sort((a,b)=>b.val-a.val)[0];else chosen=state.p2hand[0];}}if(!chosen)chosen=state.p2hand[0];playCard(2,state.p2hand.indexOf(chosen));}
function endGame(){state.gameOver=true;document.getElementById('turnbar').textContent='';document.getElementById('p1box').classList.remove('active');document.getElementById('p2box').classList.remove('active');renderP1Hand(true);let msg,cls;if(state.p1score>state.p2score){msg='Victoire !';cls='win';}else if(state.p2score>state.p1score){msg='Défaite…';cls='lose';}else{msg='Égalité !';cls='draw';}log('Partie terminée — J1: '+state.p1score+' pts | J2: '+state.p2score+' pts');showOverlay(msg,cls,true);}
function startGame(){hideOverlay();const deck=buildDeck();state={p1hand:deck.slice(0,10),p2hand:deck.slice(10,20),p1score:0,p2score:0,p1lastCard:null,p2lastCard:null,p1lastNumBeforeSpell:null,p2lastNumBeforeSpell:null,lastSpell:null,turn:1,gameOver:false,history:[]};renderPlayedCard(document.getElementById('p1played'),null);renderPlayedCard(document.getElementById('p2played'),null);document.getElementById('histArea').innerHTML='';updateScores();renderP2Hand();renderP1Hand(false);setTurn(1);log('Distribué ! Clique sur une carte pour jouer.');}
document.getElementById('btnStart').onclick=startGame;
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));}
startGame();
</script>
